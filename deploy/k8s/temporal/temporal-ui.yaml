apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: awcp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-ui

  template:
    metadata:
      labels:
        app: temporal-ui

    spec:
      enableServiceLinks: false
      containers:
      - name: temporal-ui
        image: temporalio/ui:2.21.3

        ports:
        - containerPort: 8080

        env:
        - name: TEMPORAL_ADDRESS
          value: "temporal:7233"

---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: awcp

spec:
  selector:
    app: temporal-ui

  ports:
  - port: 8080
    targetPort: 8080