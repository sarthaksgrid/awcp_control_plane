# ============================================================
# AWCP — Feature Flag Definitions
# ============================================================
# Default feature flag configurations for OpenFeature / Flipt.
#
# Flags:
#   - awcp.autonomy.full          (boolean) — enable full autonomy
#   - awcp.autonomy.conservative  (boolean) — force conservative mode
#   - awcp.write.enabled          (boolean) — global write enable
#   - awcp.trace.sampling.rate    (float)   — trace sampling ratio
#   - awcp.degradation.auto       (boolean) — auto-degrade on triggers
#   - awcp.sandbox.enabled        (boolean) — enable sandboxed execution
# ============================================================
