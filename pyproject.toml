# ============================================================
# Agent Workforce Control Plane (AWCP) — Project Configuration
# ============================================================
# Managed with uv (https://docs.astral.sh/uv/)
# ============================================================

[project]
name = "awcp-control-plane"
version = "0.1.0"
description = "Agent Workforce Control Plane — governance layer for autonomous agent workflows"
requires-python = ">=3.11"

dependencies = [
    # ── Core Framework ──────────────────────────────────────────
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.11.10",
    "pydantic-settings==2.7.1",

    # ── Workflow / Orchestration (Temporal) ─────────────────────
    "temporalio==1.9.0",

    # ── Policy Engine (OPA) ────────────────────────────────────
    "opa-python-client==2.0.4",

    # ── LLM Providers ──────────────────────────────────────────
    "anthropic==0.102.0",
    "openai==2.36.0",
    "litellm==1.84.0",

    # ── Context & Memory ───────────────────────────────────────
    "letta==0.16.7",
    "networkx==3.4.2",

    # ── Feature Flags ──────────────────────────────────────────
    "openfeature-sdk==0.7.5",
    "flipt==1.6.2",

    # ── Observability / Telemetry ──────────────────────────────
    "opentelemetry-api==1.30.0",
    "opentelemetry-sdk==1.30.0",
    "opentelemetry-exporter-otlp==1.30.0",
    "opentelemetry-instrumentation-fastapi==0.51b0",
    "opentelemetry-instrumentation-requests==0.51b0",

    # ── Operator UI ────────────────────────────────────────────
    "streamlit==1.41.1",
    "plotly==5.24.1",

    # ── Database / Storage ─────────────────────────────────────
    "sqlalchemy==2.0.49",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "redis==5.2.1",

    # ── Messaging / Event Bus ──────────────────────────────────
    "aiokafka==0.12.0",
    "nats-py==2.9.0",

    # ── Sandboxed Execution ────────────────────────────────────
    "modal==0.68.43",
    "docker==7.1.0",

    # ── Serialization & Validation ─────────────────────────────
    "orjson==3.11.9",
    "pyyaml==6.0.2",

    # ── HTTP & Async Utilities ─────────────────────────────────
    "httpx==0.28.1",
    "aiohttp==3.13.5",
    "tenacity==9.0.0",

    # ── Security ───────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==44.0.0",

    # ── Utilities ──────────────────────────────────────────────
    "python-dotenv==1.2.2",
    "structlog==25.5.0",
    "click==8.1.8",
    "rich==13.9.4",
    "PyPDF2==3.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

